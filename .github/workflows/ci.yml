name: Secure API Gateway CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1

      - name: Race detector
        run: go test -race ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway_test_password
          POSTGRES_DB: secure_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_test -d secure_gateway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migrations
        env:
          PGPASSWORD: gateway_test_password
        run: |
          for f in migrations/*.up.sql; do
            psql -h localhost -U gateway_test -d secure_gateway_test -f "$f"
          done

      - name: Run integration tests
        env:
          APP_ENV: test
          TEST_DATABASE_URL: postgres://gateway_test:gateway_test_password@localhost:5432/secure_gateway_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
          TEST_REDIS_DB: "15"
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          JWT_ISSUER: secure-api-gateway
          JWT_AUDIENCE: secure-api-client
        run: go test -tags=integration ./tests/integration -v -count=1

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [quality, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/secure-api-gateway ./cmd/api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-api-gateway-linux-amd64
          path: dist/secure-api-gateway
          if-no-files-found: error
          retention-days: 7
