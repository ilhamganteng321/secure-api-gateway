global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/prometheus/rules/slo.yml"
  - "/prometheus/rules/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

scrape_configs:
  - job_name: secure-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:3000
