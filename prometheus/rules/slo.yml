groups:
  - name: gateway-slo
    interval: 30s
    rules:
      - record: gateway:sli_availability:ratio_rate5m
        expr: |
          1 -
          (
            sum(rate(gateway_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(gateway_requests_total[5m])), 1)
          )

      - record: gateway:sli_error:ratio_rate5m
        expr: |
          sum(rate(gateway_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(gateway_requests_total[5m])), 1)

      - record: gateway:sli_latency:p95_rate5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(gateway_request_duration_seconds_bucket[5m])
            )
          )

      - record: gateway:slo_error_budget:remaining_ratio
        expr: |
          1 -
          (
            (
              sum(increase(gateway_requests_total{status=~"5.."}[30d]))
              /
              clamp_min(sum(increase(gateway_requests_total[30d])), 1)
            )
            / 0.001
          )
